name: CI/CD — Production

# Roda em todo push/merge na main: valida (CI) e publica em PRODUÇÃO na Vercel
# via CLI. O deploy automático da integração Git da Vercel deve ficar
# DESCONECTADO para não gerar deploy em duplicidade.

on:
  push:
    branches: [main]

# Serializa deploys de produção (não cancela um deploy em andamento).
concurrency:
  group: production
  cancel-in-progress: false

env:
  # IDs do projeto na Vercel (identificadores, não são segredos).
  VERCEL_ORG_ID: team_Ru0oKvfqOGJ17JDzQSK4BTOv
  VERCEL_PROJECT_ID: prj_WO7UJ0za5svrLHE9zap7QddHtMSE

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instala dependências
        run: npm ci

      # --- CI (gates de qualidade) ---
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # --- CD (deploy de produção) ---
      - name: Instala Vercel CLI
        run: npm i -g vercel@latest

      - name: Puxa env de produção da Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build de produção
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy de produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
